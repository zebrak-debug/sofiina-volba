<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofiina volba</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ffe0ec 0%, #fff5f8 100%);
    color:#5a2a3a; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
  }
  header {
    width:100%; text-align:center; padding:30px 20px;
    background:#ff6f91; color:#fff;
    box-shadow:0 4px 12px rgba(255,111,145,.4);
  }
  header h1 { font-size:2.4rem; letter-spacing:1px; }
  header p { margin-top:6px; font-style:italic; opacity:.9; }
  .products {
    display:flex; flex-wrap:wrap; gap:30px; justify-content:center;
    margin:50px 20px; max-width:1000px;
  }
  .product {
    background:#fff; padding:40px;
    border-radius:20px; box-shadow:0 10px 30px rgba(255,111,145,.25);
    width:440px; max-width:100%; text-align:center;
    display:flex; flex-direction:column;
  }
  .product h2 { flex:1; }
  .heart { font-size:5rem; }
  .product h2 { font-size:1.6rem; margin:20px 0 10px; line-height:1.3; }
  .price { font-size:1.8rem; color:#ff6f91; font-weight:bold; margin:15px 0 25px; }
  button {
    font-family:inherit; cursor:pointer; border:none;
    background:#ff6f91; color:#fff; padding:14px 30px;
    font-size:1.1rem; border-radius:30px; transition:.2s;
  }
  button:hover { background:#ff4778; transform:translateY(-2px); }
  .overlay {
    display:none; position:fixed; inset:0;
    background:rgba(90,42,58,.55); align-items:center; justify-content:center;
    padding:20px; z-index:10;
  }
  .overlay.show { display:flex; }
  .modal {
    background:#fff; border-radius:20px; padding:35px 30px;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
  }
  .modal h3 { margin-bottom:20px; font-size:1.4rem; }
  .modal input {
    font-family:inherit; width:100%; padding:12px 16px;
    border:2px solid #ffc2d4; border-radius:12px; font-size:1rem;
    margin-bottom:15px; outline:none;
  }
  .modal input:focus { border-color:#ff6f91; }
  .close { margin-top:12px; background:transparent; color:#b06; font-size:.9rem; padding:6px; }
  .close:hover { background:transparent; color:#ff4778; transform:none; }
  .msg {
    display:none; margin-top:18px; font-size:1.15rem;
    color:#ff4778; font-weight:bold; line-height:1.5;
  }
  .msg.show { display:block; animation:pop .4s ease; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .err { color:#c00; font-size:.85rem; display:none; margin-bottom:10px; }
  .err.show { display:block; }
</style>
</head>
<body>
  <header>
    <h1>Sofiina volba</h1>
    <p>Ten nejlepší eshop na světě 💕</p>
  </header>

  <div class="products">
    <div class="product">
      <div class="heart">💋</div>
      <h2>One large kiss and an extra large hug with an extra side of love</h2>
      <div class="price">1 000 pusinek</div>
      <button onclick="openCart('kiss')">Do košíku 🛒</button>
    </div>

    <div class="product">
      <div class="heart">💪</div>
      <h2>Jeden silný a vyrovnaný kluk. Nezlobík a bez splínu.</h2>
      <div class="price">1 000 pusinek</div>
      <button onclick="openCart('kluk')">Do košíku 🛒</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3>Máš slevový kód? 🎁</h3>
      <input type="text" id="code" placeholder="Zadej slevový kód" autocomplete="off">
      <div class="err" id="err">Tenhle kód neznám 🤔</div>
      <button onclick="applyCode()">Použít kód</button>
      <div class="msg" id="msg"></div>
      <button class="close" onclick="closeCart()">Zavřít</button>
    </div>
  </div>

<script>
  var products = {
    kiss: {
      code: 'milujuhonziho10',
      msg: 'Nic kupovat nemusíš, máš přece mě a u mě to máš vše zdarma.<br>Ale těch 1000 pusinek chci. ❤️'
    },
    kluk: {
      code: 'sofca+honzi=laska',
      msg: 'Jeden takový na vás už čeká na vyzvednutí (Konevova 168/1). Je potřeba ho brát někdy s rezervou a spálit nějaké nervy, ale když se budete milovat, hezky se k sobě chovat a moc mazlit. Dalšího už kupovat nemusíte! ❤️'
    }
  };
  var current = null;
  function openCart(id){ current = id; document.getElementById('overlay').classList.add('show'); }
  function closeCart(){
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('msg').classList.remove('show');
    document.getElementById('err').classList.remove('show');
    document.getElementById('code').value='';
  }
  function applyCode(){
    var code = document.getElementById('code').value.trim().toLowerCase();
    var p = products[current];
    if(p && code === p.code){
      document.getElementById('msg').innerHTML = p.msg;
      document.getElementById('msg').classList.add('show');
      document.getElementById('err').classList.remove('show');
    } else {
      document.getElementById('err').classList.add('show');
      document.getElementById('msg').classList.remove('show');
    }
  }
  document.getElementById('code').addEventListener('keydown',function(e){
    if(e.key==='Enter') applyCode();
  });
</script>
</body>
</html>
